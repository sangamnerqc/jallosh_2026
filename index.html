<meta charset="utf-8">
<title>Jallosh 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first festival app — calm light-green ground, white cards, deep green primary,
   festive saffron/red accents taken from the two institutional crests; bottom tab bar, slide-up venue sheet */
:root{
  --bg:#eef6ec;          /* very light green page */
  --surface:#ffffff;
  --surface-2:#e1eedf;   /* soft green panel */
  --line:#cfe0cb;
  --text:#17301f;        /* deep green-black */
  --muted:#557060;
  --primary:#1d6b3e;     /* institutional green */
  --primary-2:#155530;
  --on-primary:#ffffff;
  /* category / accent colours, dark enough to read on light green */
  --gold:#a86a00;
  --kumkum:#c4262f;      /* crest red */
  --peacock:#0b7a66;
  --lilac:#6a4bbf;
  --saffron:#c2560f;
  --display:"Baloo 2","Mukta",system-ui,sans-serif;
  --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 color-mix(in srgb,var(--kumkum) 60%,transparent)}
.top-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.top-in img{height:38px;width:auto;flex:0 0 auto}
.brand{font-family:var(--display);font-size:clamp(1rem,4.2vw,1.4rem);line-height:1.2!important;line-height:1;color:var(--primary);font-weight:800;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.lang{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 0 auto}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}

.view[hidden]{display:none!important}

/* crest band */
.crest{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crest figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;justify-items:center;gap:6px;align-content:start;text-align:center}
.crest img{height:86px;width:100%;object-fit:contain}
.crest figcaption{font-size:.82rem;line-height:1.25;color:var(--text);font-weight:600}
.crest figcaption small{display:block;color:var(--muted);font-weight:500;font-size:.74rem}
.crest .role{font-size:.7rem;font-weight:700;color:var(--kumkum)}

/* hero */
.hero{position:relative;padding-block:12px 4px;display:grid;gap:14px}
.hero-art{position:relative;width:100%;max-width:330px;aspect-ratio:1;margin:0 auto}
.hero-art canvas{width:100%;height:100%;display:block}
.hero-art .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.hero-art .center b{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8.4vw,2.2rem);line-height:1;color:var(--kumkum)}
.hero-art .center span{display:block;font-family:var(--display);font-weight:700;color:var(--primary);font-size:1.15rem;margin-top:2px}
.welcome{text-align:center;display:grid;gap:6px}
.welcome h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6.3vw,2.3rem);line-height:1.2;margin:0;color:var(--primary);text-wrap:balance}
.welcome .en{font-size:1.05rem;color:var(--text);font-weight:600;margin:0;text-wrap:balance}
.welcome p.lead{margin:4px auto 0;max-width:56ch;color:var(--muted);text-wrap:pretty}
.org{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:.88rem;color:var(--muted)}
.org b{color:var(--text);font-weight:600}
.org i{font-style:normal;color:var(--kumkum)}

.datecard{margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cal{width:64px;text-align:center;border-radius:10px;overflow:hidden;border:1px solid var(--kumkum);background:var(--surface)}
.cal .m{background:var(--kumkum);color:var(--on-primary);font-size:.72rem;font-weight:700;letter-spacing:.1em;padding:2px 0}
.cal .d{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.2;color:var(--primary)}
.datecard h3{margin:0;font-size:1.05rem}
.datecard p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.count{display:inline-block;margin-top:6px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border:1px solid var(--primary);border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem}

.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;color:var(--text)}
.sec-h span{color:var(--muted);font-size:.9rem}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--text);min-width:0}
.qbtn:hover{border-color:var(--primary)}
.qbtn .ic{font-size:1.25rem;line-height:1;color:var(--primary);margin-bottom:4px}
.qbtn b{font-size:1rem;font-weight:700}
.qbtn small{color:var(--muted);font-size:.82rem}
.qbtn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.qbtn.primary .ic,.qbtn.primary small{color:var(--on-primary)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat{position:relative;border:1px solid var(--line);text-align:left;border-radius:var(--r);padding:14px;background:var(--surface);overflow:hidden;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end}
.cat:hover{border-color:var(--c)}
.cat::before{content:"";position:absolute;right:-18px;top:-18px;width:72px;height:72px;border-radius:50%;background:var(--c)}
.cat .glyph{position:absolute;right:9px;top:7px;font-size:1.5rem;color:var(--on-primary)}
.cat b{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.15;color:var(--text)}
.cat small{color:var(--muted);font-size:.85rem}
.cat .n{font-size:.78rem;color:var(--c);font-weight:700;margin-top:4px}

.note{border-left:3px solid var(--primary);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--muted);font-size:.92rem}
.note b{color:var(--text)}

/* events */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,55px));z-index:10;background:var(--bg);padding-block:10px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem;white-space:nowrap;color:var(--text)}
.tab[aria-selected="true"]{background:var(--c,var(--primary));border-color:var(--c,var(--primary));color:var(--on-primary)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:6px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:10px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.coord{margin:14px 0 4px;color:var(--muted);font-size:.9rem}
.coord b{color:var(--text)}
.list{display:grid;gap:10px;margin-top:10px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--text)}
.ev:hover{border-color:var(--c)}
.ev .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:800}
.ev .t{min-width:0}
.ev .t b{display:block;font-size:1.05rem;line-height:1.3}
.ev .t small{display:block;color:var(--muted);font-size:.86rem}
.ev .pin{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:.86rem;color:var(--c);font-weight:600}
.ev .go{color:var(--muted);font-size:1.3rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* venues */
.vgroup{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.vgroup h3{margin:0;padding:12px 14px;font-size:1.05rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.vgroup h3 small{color:var(--muted);font-weight:500;font-size:.85rem}
.vrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px dashed var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .nm{min-width:0}
.vrow .nm b{display:block;font-size:.98rem}
.vrow .nm small{color:var(--muted);font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.78rem;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);border:0;font-weight:600}
.mapbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--primary);color:var(--on-primary);font-weight:700;border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.mapbtn:hover{background:var(--primary-2)}

/* help */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:0;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);color:var(--primary);font-weight:700;font-size:.85rem}
td{background:var(--surface)}
tr:last-child td{border-bottom:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.mini b{font-size:1rem}
.mini small{color:var(--muted)}
/* facilities (home): Xerox centre + nearest washroom */
button.mapbtn{border:0;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.mapbtn.ghost{background:var(--surface-2);color:var(--primary);border:1px solid var(--line)}
.mini .fac-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.mini .dist{display:inline-block;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border-radius:999px;padding:0 8px;font-weight:700;font-size:.8rem}
.mini .wlist{display:grid;gap:6px;margin-top:6px}
.mini .wlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.mini.wide{grid-column:1/-1}
.wc-map{position:relative;isolation:isolate;height:340px;border-radius:10px;border:1px solid var(--line);margin-top:6px;overflow:hidden;background:var(--surface-2);z-index:0}
.wc-maperr{padding:16px;color:var(--muted);font-size:.9rem}
.wc-pin{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-family:var(--body)}
.wc-pin.near{background:var(--kumkum);transform:scale(1.2)}
.wc-pop{display:grid;gap:6px;font-family:var(--body);min-width:140px}
.wc-pop .mapbtn{color:var(--on-primary);justify-content:center}
.wc-pop .near-tag{margin-left:6px;font-size:.75rem;font-weight:700;color:var(--kumkum)}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:6px;padding:0 6px;margin-right:4px}
.tag.g{background:color-mix(in srgb,var(--kumkum) 13%,transparent);color:var(--kumkum)}
.tag.b{background:color-mix(in srgb,var(--peacock) 13%,transparent);color:var(--peacock)}
.sub{color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:#0d1f1466;z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92%;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #0d1f1426}
.sheet.show{transform:none}
.sheet-in{max-width:760px;margin:0 auto;padding-inline:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.sheet-head{display:flex;gap:10px;align-items:flex-start;padding-top:12px}
.sheet-head .ttl{flex:1;min-width:0}
.eyebrow{font-size:.8rem;text-transform:uppercase;color:var(--c);font-weight:700}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.2;margin:2px 0 0;color:var(--text);text-wrap:balance}
.sheet h2 + p{margin:2px 0 0;color:var(--muted);font-weight:600}
.close{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;flex:0 0 auto;font-size:1.1rem;color:var(--text)}
.venue-card{margin-top:16px;border-radius:var(--r);padding:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c)}
.venue-card .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase}
.venue-card .vn{font-size:1.35rem;font-weight:800;line-height:1.25;margin-top:2px}
.venue-card .vs{color:var(--muted)}
.venue-card .floor{display:inline-block;margin-top:8px;font-size:.84rem;font-weight:700;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:1px 10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:12px;padding:12px;font-weight:800;text-align:center;line-height:1.25}
.bigbtn.go{background:var(--primary);color:var(--on-primary)}
.bigbtn.alt{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.bigbtn small{display:block;font-weight:600;font-size:.75rem;opacity:.85}
.path{list-style:none;margin:18px 0 0;padding:0;display:grid}
.path li{display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:16px}
.path li::before{content:"";position:absolute;left:15px;top:30px;bottom:0;border-left:2px dashed var(--line)}
.path li:last-child::before{display:none}
.path .st{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface);border:2px solid var(--c);color:var(--c);font-size:.9rem;position:relative;z-index:1}
.path li:last-child .st{background:var(--c);color:var(--on-primary)}
.path b{display:block;font-size:1rem}
.path small{color:var(--muted);font-size:.88rem}
.people{margin-top:8px;display:grid;gap:10px}
.people h4{margin:12px 0 0;font-size:.85rem;color:var(--muted)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.92rem}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 4px 10px;display:grid;justify-items:center;gap:1px;color:var(--muted);font-size:.8rem;font-weight:600}
.nav button .i{font-size:1.25rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--primary)}
.nav button[aria-current="page"] .i{color:var(--kumkum)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--surface);font-weight:700;padding:8px 16px;border-radius:999px;z-index:60;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:.85rem;display:grid;gap:4px}
.foot b{color:var(--text)}
.foot .princ{display:grid;gap:0;line-height:1.35}
.foot .credit{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:620px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}.crest img{height:110px}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">विद्यापीठस्तरीय आंतरमहाविद्यालयीन युवक महोत्सव - जल्लोष  २०२६<small>Jallosh 2026 · Youth Festival</small></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-mr" data-lang="mr" aria-pressed="true">मराठी</button>
      <button id="lang-en" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- HOME -->
  <section class="view" id="view-home">
    <div class="crest" id="logos"></div>
    <div class="hero">
      <div class="hero-art">
        <canvas id="rangoli" width="680" height="680" aria-hidden="true"></canvas>
        <div class="center"><div><b>जल्लोष</b><span>२०२६</span></div></div>
      </div>
      <div class="welcome">
        <h1 data-mr="सर्व सहभागी कलाकार व मान्यवरांचे हार्दिक स्वागत!" data-en="A warm welcome to every participant and guest!"></h1>
        <p class="en" data-mr="A warm welcome to every participant and guest!" data-en="सर्व सहभागी कलाकार व मान्यवरांचे हार्दिक स्वागत!"></p>
        <p class="lead" data-mr=" आपला कलाप्रकार निवडा, ठिकाण पहा आणि Google Maps वरून थेट मार्ग मिळवा." data-en="University-level inter-collegiate youth festival. Pick your event, see its venue, and get turn-by-turn directions on Google Maps."></p>
        
      </div>
      <div class="datecard">
        <div class="cal"><div class="m">OCT</div><div class="d">09</div></div>
        <div>
          <h3 data-mr="शुक्रवार, ०९ ऑक्टोबर २०२६" data-en="Friday, 09 October 2026"></h3>
          <p data-mr="संगमनेर महाविद्यालय परिसर, घुलेवाडी, पुणे–नाशिक महामार्ग" data-en="Sangamner College campus, Ghulewadi, Pune–Nashik Highway"></p>
          <span class="count" id="countdown"></span>
        </div>
      </div>
    </div>

    <div class="sec-h"><h2 data-mr="त्वरित मदत" data-en="Quick links"></h2></div>
    <div class="quick">
      <a class="qbtn primary" id="q-college" target="_blank" rel="noopener">
        <span class="ic">➤</span><b data-mr="महाविद्यालयात पोहचण्याचा मार्ग" data-en="Directions to college"></b><small>Google Maps</small>
      </a>
      <button class="qbtn" data-goto="help" data-anchor="reg">
        <span class="ic">✎</span><b data-mr="नाव नोंदणी" data-en="Registration"></b><small data-mr="जिल्हानिहाय संपर्क" data-en="District-wise desks"></small>

/* countdown, IST day-based */
function countdown(){
  const now = new Date(Date.now() + 330*60000); // shift to IST
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const ev = Date.UTC(2026,9,9);
  const d = Math.round((ev - today)/86400000);
  let s;
  if(d>1) s = LANG==="mr" ? `अजून ${d} दिवस · ${d} days to go` : `${d} days to go · अजून ${d} दिवस`;
  else if(d===1) s = LANG==="mr" ? "उद्या! · Tomorrow!" : "Tomorrow! · उद्या!";
  else if(d===0) s = LANG==="mr" ? "आज! · Festival day" : "Festival day! · आज";
  else s = LANG==="mr" ? "धन्यवाद! · Thank you" : "Thank you! · धन्यवाद";
  $("#countdown").textContent = s;
}

function closeSheet(fromHistory){
  const sh = $("#sheet"), sc = $("#scrim");
  if(sh.hidden) return;
  // opened with its own history step → step back, popstate finishes the close
  if(!fromHistory && history.state && history.state.sheet){ history.back(); return; }
  sh.classList.remove("show"); sc.classList.remove("show");
  setTimeout(()=>{ sh.hidden = true; sc.hidden = true; }, 300);
  if(!fromHistory) setHash(curView==="home"?"":curView, true);
  if(lastFocus) lastFocus.focus();
}
$("#scrim").addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

/* history: each screen change adds a step, so the phone's Back button walks back through
   the app (closes the event card, returns to the previous tab) instead of leaving the page */
let ROUTING = false;
function setHash(h, replace, state){
  if(ROUTING) return; // the address is already right when Back/Forward or a shared link brought us here
  const url = h ? "#"+h : location.pathname+location.search;
  if((location.hash||"") === (h ? "#"+h : "")) return;
  try{
    if(replace) history.replaceState(state||null, "", url);
    else history.pushState(state||null, "", url);
  }catch(e){}
}

function walkDir(p){ return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(p.lat+","+p.lng)+"&travelmode=walking"; }
function metres(a,b){ // straight-line distance between two pins
  const R=6371000, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const s=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function fmtDist(m){ return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km"; }

/* washroom state — st: idle | locating | found | denied | unavailable; open: map shown */
let WC = {st:"idle", me:null, near:null, dist:{}, open:false};
function findNearestWashroom(){
  if(!("geolocation" in navigator) || !window.isSecureContext){ WC.st="unavailable"; renderFacilities(); return; }
  WC.st="locating"; renderFacilities();
  navigator.geolocation.getCurrentPosition(pos => {
    const me={lat:pos.coords.latitude, lng:pos.coords.longitude};
    const dist={}; WASHROOMS.forEach(w=>dist[w.n]=metres(me,w));
    const near=WASHROOMS.slice().sort((a,b)=>dist[a.n]-dist[b.n])[0];
    Object.assign(WC,{st:"found", me, near, dist}); renderFacilities();
  }, err => { WC.st = err.code===1 ? "denied" : "unavailable"; renderFacilities(); },
  {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

/* map of all washrooms — Leaflet + OpenStreetMap, loaded only when first opened */
let leafletP = null, wcMap = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletP) return leafletP;
  leafletP = new Promise((ok,fail)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload=ok; s.onerror=()=>{ leafletP=null; fail(); }; document.head.appendChild(s);
  });
  return leafletP;
}
function drawWashroomMap(){
  const box = document.getElementById("wc-map"); if(!box) return;
  loadLeaflet().then(()=>{
    if(!document.body.contains(box)) return;
    if(wcMap){ wcMap.remove(); wcMap=null; }
    const mr = LANG==="mr";
    wcMap = L.map(box, {zoomControl:true, attributionControl:true});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:20, maxNativeZoom:19, attribution:"© OpenStreetMap"}).addTo(wcMap);
    const pts = []; let nearMarker = null;
    WASHROOMS.forEach(w=>{
      const isNear = WC.near && WC.near.n===w.n;
      const icon = L.divIcon({className:"", html:`<div class="wc-pin${isNear?" near":""}">${w.n}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14]});
      const d = WC.dist[w.n];
      const pop = `<div class="wc-pop"><b>${mr?"स्वच्छतागृह ":"Washroom "}${w.n}</b>${isNear?`<span class="near-tag">${mr?"सर्वात जवळ":"Nearest"}</span>`:""}
        ${d!=null?`<div>${fmtDist(d)} ${mr?"दूर":"away"}</div>`:""}
        <a class="mapbtn" href="${walkDir(w)}" target="_blank" rel="noopener">➤ ${mr?"येथे जा":"Go here"}</a></div>`;
      const m = L.marker([w.lat,w.lng],{icon, title:(mr?"स्वच्छतागृह ":"Washroom ")+w.n, zIndexOffset:isNear?1000:0}).addTo(wcMap).bindPopup(pop);
      if(isNear) nearMarker = m;
      pts.push([w.lat,w.lng]);
    });
    if(WC.me){
      L.circleMarker([WC.me.lat,WC.me.lng],{radius:8, color:"#ffffff", weight:3, fillColor:"#1a73e8", fillOpacity:1}).addTo(wcMap)
        .bindTooltip(mr?"आपण येथे आहात":"You are here",{direction:"top"});
      if(WC.near && WC.dist[WC.near.n] < 1500) pts.push([WC.me.lat,WC.me.lng]); // include me only when on campus
    }
    wcMap.fitBounds(pts, {padding:[28,28], maxZoom:19});
    if(nearMarker) nearMarker.openPopup(); // open only after the map has a view
  }).catch(()=>{
    box.innerHTML = `<div class="wc-maperr">${LANG==="mr"?"नकाशा लोड झाला नाही (इंटरनेट तपासा). खालील यादी वापरा.":"Map couldn't load (check internet). Use the list below."}</div>`;
  });
}

function renderFacilities(){
  const mr = LANG==="mr";
  const wName = w => (mr?"स्वच्छतागृह ":"Washroom ")+w.n;
  const go = (p,label) => `<a class="mapbtn" href="${walkDir(p)}" target="_blank" rel="noopener">➤ ${label||(mr?"मार्ग":"Directions")}</a>`;
  const order = WC.st==="found" ? WASHROOMS.slice().sort((a,b)=>WC.dist[a.n]-WC.dist[b.n]) : WASHROOMS;
  const list = `<div class="wlist">${order.map(w=>`<div><span>${wName(w)}${WC.near&&WC.near.n===w.n?` <span class="dist">${mr?"सर्वात जवळ":"Nearest"}</span>`:""}${WC.dist[w.n]!=null?` <small>· ${fmtDist(WC.dist[w.n])}</small>`:""}</span>${go(w)}</div>`).join("")}</div>`;
  let status = "";
  if(WC.st==="found") status = `<div class="fac-row"><span>${mr?"आपल्यापासून सर्वात जवळचे:":"Nearest to you:"}</span><b>${wName(WC.near)}</b><span class="dist">${fmtDist(WC.dist[WC.near.n])}</span></div>`
     + (WC.dist[WC.near.n]>1500?`<small>${mr?"आपण महाविद्यालय परिसरापासून दूर आहात असे दिसते.":"You seem to be away from the campus."}</small>`:"");
  else if(WC.st==="locating") status = `<small>${mr?"आपले ठिकाण शोधत आहे…":"Finding your location…"}</small>`;
  else if(WC.st==="denied") status = `<small>${mr?"ठिकाण परवानगी मिळाली नाही — नकाशावरून हवे ते स्वच्छतागृह निवडा.":"Location not allowed — pick any washroom on the map."}</small>`;
  else if(WC.st==="unavailable") status = `<small>${mr?"आपले ठिकाण मिळाले नाही — नकाशावरून हवे ते स्वच्छतागृह निवडा.":"Couldn't get your location — pick any washroom on the map."}</small>`;

  const wcBody = WC.open
    ? `${status}
       <div id="wc-map" class="wc-map" role="region" aria-label="${mr?"स्वच्छतागृह नकाशा":"Washroom map"}"></div>
       <small>${mr?"नकाशावरील क्रमांकावर टॅप करा → \"येथे जा\" दाबा.":"Tap a numbered pin → press \"Go here\"."}</small>
       <div class="fac-row">${WC.st!=="locating"?`<button class="mapbtn ghost" id="wc-find">⌖ ${WC.st==="found"?(mr?"पुन्हा शोधा":"Refresh my location"):(mr?"माझ्या जवळचे दाखवा":"Show nearest to me")}</button>`:""}<button class="mapbtn ghost" id="wc-toggle">✕ ${mr?"नकाशा बंद करा":"Close map"}</button></div>
       ${list}`
    : `<div>${mr?"परिसरातील सर्व ६ स्वच्छतागृहे नकाशावर पहा आणि हवे तिथे जा.":"See all 6 washrooms on the campus map and choose where to go."}</div>
       ${status}
       <div class="fac-row"><button class="mapbtn" id="wc-toggle">🗺 ${mr?"स्वच्छतागृहे नकाशावर पहा":"Show washrooms on map"}</button></div>`;

  $("#facilities").innerHTML = `
    <div class="mini"><b>${mr?"झेरॉक्स सेंटर":"Xerox Centre"}</b><small>${mr?"Xerox Centre":"झेरॉक्स सेंटर"}</small>
      <div>${mr?"झेरॉक्स / प्रिंटआउट साठी":"For photocopies and printouts"}</div>
      <div class="fac-row">${go(XEROX)}</div></div>
    <div class="mini${WC.open?" wide":""}" id="wc-card"><b>${mr?"स्वच्छतागृह":"Washrooms"}</b><small>${mr?"Washrooms":"स्वच्छतागृह"}</small>${wcBody}</div>`;

  const t = document.getElementById("wc-toggle");
  if(t) t.onclick = () => {
    WC.open = !WC.open; renderFacilities();
    if(WC.open){
      if(WC.st==="idle") findNearestWashroom();   // ask for location once, to mark "you are here"
      const c=document.getElementById("wc-card"); if(c) c.scrollIntoView({behavior:"smooth", block:"start"});
    }
  };
  const f = document.getElementById("wc-find"); if(f) f.onclick = findNearestWashroom;
  if(WC.open) drawWashroomMap(); else if(wcMap){ wcMap.remove(); wcMap=null; }
}
// if the visitor already allowed location earlier, work out the nearest washroom quietly
try{ navigator.permissions && navigator.permissions.query({name:"geolocation"}).then(p=>{ if(p.state==="granted") findNearestWashroom(); }).catch(()=>{}); }catch(e){}

function renderAll(){
  applyStatic(); renderLogos(); countdown(); renderCats(); renderTabs(); renderEvents(); renderVenues(); renderHelp(); renderFacilities();
  $("#q-college").href = mapsDir(null);
}

/* events */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,a"); if(!t) return;
  if(t.dataset.lang){ LANG = t.dataset.lang; try{localStorage.setItem("jallosh-lang",LANG)}catch(e){} renderAll(); return; }
  if(t.dataset.view){ show(t.dataset.view); return; }
  if(t.dataset.goto){ show(t.dataset.goto, t.dataset.anchor); return; }
  if(t.dataset.cat){ curCat = t.dataset.cat; renderTabs(); renderEvents(); show("events"); setHash(curCat, true); return; }
  if(t.dataset.tab){ curCat = t.dataset.tab; renderTabs(); renderEvents(); setHash(curCat==="all"?"events":curCat, true); return; }
  if(t.dataset.ev){ openEvent(t.dataset.ev); return; }
  if(t.id==="sh-close"){ closeSheet(); return; }
});
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }
$("#q").addEventListener("input", renderEvents);

/* deep links: #events #venues #help #music #dance #theatre #literary #fine or an event id */
function route(){
  const h = (location.hash||"").slice(1);
  const isEv = EV.some(e=>e.id===h);
  ROUTING = true;
  try{
    if(!isEv) closeSheet(true);
    if(!h){ if(curView!=="home") show("home"); }
    else if(["events","venues","help"].includes(h)){ if(curView!==h) show(h); }
    else if(CATS.some(c=>c.id===h)){ if(curCat!==h){ curCat=h; renderTabs(); renderEvents(); } if(curView!=="events") show("events"); }
    else if(isEv){ const e=EV.find(x=>x.id===h); if(curCat!=="all" && curCat!==e.cat){ curCat=e.cat; renderTabs(); renderEvents(); } if(curView!=="events") show("events"); openEvent(h); }
  } finally { ROUTING = false; }
}

/* rangoli wheel — draws itself, then keeps turning: rings counter-rotate, petals breathe,
   dots twinkle, sparks orbit. Tap the wheel for a spin burst. */
(function rangoli(){
  const cv = $("#rangoli"), x = cv.getContext("2d");
  const W = cv.width, C = W/2, TAU = Math.PI*2;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = {gold:"#f2a516",kum:"#e0303a",pea:"#1f9a6e",lil:"#8a6be0",saf:"#f07a1a",paper:css("--primary"),silk:"#ffffff",ink:css("--surface"),vein:css("--text")};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rings = [
    {n:8,  r0:120,r1:200,w:46,c:col.kum, sp: .10},
    {n:16, r0:190,r1:262,w:30,c:col.gold,sp:-.16},
    {n:12, r0:140,r1:300,w:22,c:col.pea, sp: .07},
    {n:24, r0:262,r1:318,w:16,c:col.saf, sp:-.22},
    {n:32, r0:300,r1:334,w:9, c:col.lil, sp: .28}
  ];
  const sparks = Array.from({length:14},(_,i)=>({a:Math.random()*TAU, r:150+Math.random()*190, s:.3+Math.random()*.6, z:1.5+Math.random()*2.5, c:[col.gold,col.paper,col.saf][i%3]}));
  let boost = 0, spin = 0;
  function petal(a, r0, r1, w, c, k){
    const rr = r0 + (r1-r0)*k;
    x.save(); x.rotate(a);
    x.beginPath(); x.moveTo(r0,0);
    x.quadraticCurveTo((r0+rr)/2, -w*k, rr, 0);
    x.quadraticCurveTo((r0+rr)/2, w*k, r0, 0);
    x.fillStyle = c; x.fill();
    // inner vein
    x.beginPath(); x.moveTo(r0+6,0); x.lineTo(r0+(rr-r0)*.7,0);
    x.strokeStyle = col.vein; x.globalAlpha = .18; x.lineWidth = 2; x.stroke(); x.globalAlpha = 1;
    x.restore();
  }
  function frame(draw, time){
    x.setTransform(1,0,0,1,0,0);
    x.clearRect(0,0,W,W);
    x.translate(C,C);
    const breathe = 1 + .018*Math.sin(time*1.6);
    x.scale(breathe, breathe);
    // glowing halo
    const halo = x.createRadialGradient(0,0,90,0,0,340);
    halo.addColorStop(0, "transparent"); halo.addColorStop(.75, col.gold+"00");
    halo.addColorStop(.92, col.gold+Math.round(40+30*Math.sin(time*2)).toString(16).padStart(2,"0"));
    halo.addColorStop(1, "transparent");
    x.beginPath(); x.arc(0,0,340,0,TAU); x.fillStyle=col.silk; x.globalAlpha=.75; x.fill(); x.globalAlpha=1;
    x.fillStyle = halo; x.fill();
    rings.slice().reverse().forEach((r,idx)=>{
      const ri = rings.length-1-idx;
      const k = Math.max(0, Math.min(1, draw*1.6 - idx*0.12));
      if(k<=0) return;
      const ease = 1-Math.pow(1-k,3);
      const pulse = 1 + .05*Math.sin(time*2.2 + ri*1.3);
      const rot = (ri%2? Math.PI/r.n:0) + r.sp*(time + spin)*(1);
      for(let i=0;i<r.n;i++) petal(i/r.n*TAU + rot, r.r0, r.r0+(r.r1-r.r0)*pulse, r.w, r.c, ease);
    });
    const k2 = Math.max(0, Math.min(1, draw*1.6-0.7));
    // twinkling outer dots, slowly turning
    for(let i=0;i<48*k2;i++){
      const a = i/48*TAU - time*.05;
      x.globalAlpha = .45 + .55*Math.abs(Math.sin(time*2.5 + i*.7));
      x.beginPath(); x.arc(Math.cos(a)*342, Math.sin(a)*342, 5, 0, TAU); x.fillStyle=col.gold; x.fill();
    }
    x.globalAlpha = 1;
    for(let i=0;i<24*k2;i++){ const a=i/24*TAU + time*.12; x.beginPath(); x.arc(Math.cos(a)*118, Math.sin(a)*118, 6, 0, TAU); x.fillStyle=col.paper; x.fill(); }
    // orbiting sparks
    if(draw>=1) sparks.forEach(p=>{
      const a = p.a + time*p.s*(1+boost*4);
      const tw = .5+.5*Math.sin(time*4+p.a*5);
      x.globalAlpha = .35+.65*tw;
      x.save(); x.translate(Math.cos(a)*p.r, Math.sin(a)*p.r); x.rotate(time);
      x.fillStyle = p.c; x.beginPath();
      for(let j=0;j<4;j++){ const aa=j/4*TAU; x.lineTo(Math.cos(aa)*p.z*3, Math.sin(aa)*p.z*3); x.lineTo(Math.cos(aa+TAU/8)*p.z, Math.sin(aa+TAU/8)*p.z); }
      x.closePath(); x.fill(); x.restore();
    });
    x.globalAlpha = 1;
    // centre medallion with turning dashed ring
    x.beginPath(); x.arc(0,0,112,0,TAU); x.fillStyle=col.ink; x.fill();
    x.save(); x.rotate(-time*.3);
    x.lineWidth=4; x.strokeStyle=col.kum; x.setLineDash([2,10]); x.lineCap="round"; x.stroke(); x.setLineDash([]);
    x.restore();
  }
  if(reduce){ frame(1, 0); return; }
  frame(1, 0); // complete at rest before the animation starts
  let st = null, last = 0;
  function tick(ts){
    if(st===null) st = ts;
    const dt = Math.min(.05, (ts-last)/1000 || 0); last = ts;
    const t = (ts-st)/1000;
    if(boost>0){ spin += dt*boost*14; boost = Math.max(0, boost - dt*.9); }
    frame(Math.min(t/1.8, 1), t);
    requestAnimationFrame(tick);
  }
  const start = () => requestAnimationFrame(tick);
  (document.fonts && document.fonts.ready) ? document.fonts.ready.then(start) : start();
  const art = cv.parentElement;
  art.style.cursor = "pointer";
  art.setAttribute("role","button"); art.setAttribute("tabindex","0");
  art.setAttribute("aria-label","Spin the rangoli");
  const kick = () => { boost = 1; };
  art.addEventListener("click", kick);
  art.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); kick(); } });
})();

renderAll();
route();
/* keep the sticky event tabs just under the header, whatever its height */
(function(){ const h=document.querySelector(".top"); const set=()=>document.documentElement.style.setProperty("--top-h", h.offsetHeight+"px"); set(); try{ new ResizeObserver(set).observe(h); }catch(e){ addEventListener("resize", set); } })();
window.addEventListener("popstate", route);
setInterval(countdown, 60000);
</script>
